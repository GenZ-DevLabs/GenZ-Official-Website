# Deploys genz-official-website/ to GitHub Pages as a static export.
#
# INSTALL: this file must live at .github/workflows/deploy-pages.yml in the
# REPOSITORY ROOT, not inside genz-official-website/. push-to-github.ps1
# copies it there automatically.
#
# One-time setup in the repo: Settings -> Pages -> Build and deployment ->
# Source: "GitHub Actions".
#
# Site URL: https://genz-devlabs.github.io/GenZ-Official-Website/
# For a custom domain, set BASE_PATH below to '' and add a CNAME file to
# genz-official-website/public/.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "genz-official-website/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one more.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  APP_DIR: genz-official-website
  BASE_PATH: /GenZ-Official-Website

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.APP_DIR }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ env.APP_DIR }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ env.BASE_PATH }}
        run: npm run build

      - name: Disable Jekyll processing
        run: touch out/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.APP_DIR }}/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
